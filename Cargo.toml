[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Colin Wolff <1562545+colinwolff@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/gaugeblock/common"
homepage = "https://gaugeblock.dev"
readme = "README.md"
keywords = ["contracts", "neurosymbolic", "codegen", "gaugeblock"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "gaugeblock-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Foundation library for the gaugeblock neurosymbolic suite"

[dependencies]
gaugeblock-contracts = { path = "crates/gaugeblock-contracts", version = "0.1.0-beta.1" }

[lints]
workspace = true

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
